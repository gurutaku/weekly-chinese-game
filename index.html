<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fffaf4" />
  <meta name="description" content="每週 10 個中文字學習遊戲：筆順、注音、發音、意思、例句與練習。" />
  <title>每週學 10 個中文字</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">中文學習小遊戲</div>
        <h1>每週 10 個中文字 <span class="spark">✦</span></h1>
        <p class="subtitle">看筆順、聽發音、學注音、讀意思，最後自己寫寫看。</p>
      </div>
      <button id="resetProgress" class="ghost-btn" type="button" title="清除本機學習紀錄">重設紀錄</button>
    </header>

    <main>
      <section class="week-hero card">
        <div class="hero-main">
          <div class="week-label">本週學習</div>
          <div id="weekRange" class="week-range">載入中…</div>
          <div id="progressText" class="progress-text">0 / 10 已完成</div>
          <div class="progress-track" aria-label="本週完成進度">
            <div id="progressBar" class="progress-bar" style="width: 0%"></div>
          </div>
        </div>
        <div class="hero-side">
          <div class="streak-card">
            <div class="streak-icon">🔥</div>
            <div>
              <div class="mini-label">連續學習</div>
              <strong id="streakValue">0 天</strong>
            </div>
          </div>
          <button id="startPractice" class="primary-btn" type="button">開始本週練習</button>
        </div>
      </section>

      <section id="characterGrid" class="character-grid" aria-label="本週 10 個中文字"></section>

      <section id="learn-panel" class="learn-panel card" aria-live="polite">
        <div class="panel-head">
          <div>
            <div class="week-label">正在學</div>
            <h2 id="selectedTitle">請選一個字</h2>
          </div>
          <div class="head-actions">
            <button id="speakBtn" class="icon-btn" type="button" aria-label="播放發音">🔊</button>
            <button id="markBtn" class="soft-btn" type="button">標記完成</button>
          </div>
        </div>

        <div class="learning-layout">
          <div class="stroke-card">
            <div class="stroke-toolbar">
              <span>筆順</span>
              <div class="stroke-actions">
                <button id="animateBtn" class="tiny-btn" type="button">播放</button>
                <button id="quizBtn" class="tiny-btn accent" type="button">我來寫</button>
              </div>
            </div>
            <div id="writer" class="writer" aria-label="中文字筆順動畫區"></div>
            <div id="writerStatus" class="writer-status">選字後載入筆順。</div>
          </div>

          <div class="facts-card">
            <div class="pronunciation-row">
              <div class="fact-block">
                <div class="fact-label">注音</div>
                <div id="bopomofo" class="bopomofo">—</div>
              </div>
              <div class="fact-block">
                <div class="fact-label">發音</div>
                <div id="pinyin" class="pinyin">—</div>
              </div>
            </div>

            <div class="fact-divider"></div>

            <div class="meaning-block">
              <div class="fact-heading">
                <div class="fact-label">意思</div>
                <button id="meaningSpeakBtn" class="tiny-btn speak-text-btn" type="button" aria-label="朗讀意思" title="朗讀意思">🔊 朗讀</button>
              </div>
              <div id="meaning" class="meaning">—</div>
            </div>

            <div class="sentence-block">
              <div class="fact-heading">
                <div class="fact-label">例句</div>
                <button id="sentenceSpeakBtn" class="tiny-btn speak-text-btn" type="button" aria-label="朗讀例句" title="朗讀例句">🔊 朗讀</button>
              </div>
              <div id="sentence" class="sentence">—</div>
              <div id="sentenceEnglish" class="sentence-en">—</div>
            </div>

            <div class="tip-box">
              <span class="tip-icon">💡</span>
              <span id="tipText">先看清楚每一筆從哪裡開始，再跟著寫。</span>
            </div>
          </div>
        </div>
      </section>

      <section id="practiceSection" class="practice-panel card hidden">
        <div class="panel-head">
          <div>
            <div class="week-label">小測驗</div>
            <h2>你記得哪一個字？</h2>
          </div>
          <button id="closePractice" class="ghost-btn" type="button">回到學習</button>
        </div>
        <div class="practice-content">
          <div id="practicePrompt" class="practice-prompt">注音：—</div>
          <div class="practice-choices" id="practiceChoices"></div>
          <div id="practiceFeedback" class="practice-feedback" aria-live="polite"></div>
          <button id="nextQuestion" class="primary-btn hidden" type="button">下一題</button>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>適合手機、平板與桌面瀏覽器</span>
      <span>進度只保存在這台裝置的瀏覽器中</span>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.3/dist/hanzi-writer.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
